basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      business_address:
        type: string
      business_description:
        type: string
      business_name:
        type: string
      business_phone:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - business_name
    - email
    - name
    - password
    type: object
  bot.UpdateBotPromptRequest:
    properties:
      agent_api:
        example: https://api.example.com
        type: string
      agent_prompt:
        example: Kamu adalah asisten e-commerce AI yang ramah.
        type: string
    type: object
  busines.RegisterBusinessRequest:
    properties:
      address:
        type: string
      description:
        type: string
      name:
        type: string
      phone_business:
        type: string
    required:
    - address
    - name
    - phone_business
    type: object
  chat.Change:
    properties:
      field:
        type: string
      value:
        $ref: '#/definitions/chat.ChangeValue'
    type: object
  chat.ChangeValue:
    properties:
      contacts:
        items:
          $ref: '#/definitions/chat.Contact'
        type: array
      messages:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      messaging_product:
        type: string
      metadata:
        $ref: '#/definitions/chat.Metadata'
    type: object
  chat.Contact:
    properties:
      profile:
        $ref: '#/definitions/chat.Profile'
      wa_id:
        type: string
    type: object
  chat.Entry:
    properties:
      changes:
        items:
          $ref: '#/definitions/chat.Change'
        type: array
      id:
        type: string
    type: object
  chat.Message:
    properties:
      from:
        type: string
      id:
        type: string
      text:
        $ref: '#/definitions/chat.MessageText'
      timestamp:
        type: string
      type:
        type: string
    type: object
  chat.MessageText:
    properties:
      body:
        type: string
    type: object
  chat.Metadata:
    properties:
      display_phone_number:
        type: string
      phone_number_id:
        type: string
    type: object
  chat.Profile:
    properties:
      name:
        type: string
    type: object
  chat.SendMediaMessage:
    properties:
      caption:
        type: string
      media_url:
        type: string
      to:
        type: string
      type:
        description: image, document, video, audio
        type: string
    required:
    - to
    - type
    type: object
  chat.SendMessage:
    properties:
      msg:
        type: string
      to:
        type: string
    type: object
  chat.WebhookPayload:
    properties:
      entry:
        items:
          $ref: '#/definitions/chat.Entry'
        type: array
      object:
        type: string
    type: object
  conversation.ConversationDetailResponse:
    properties:
      customer_id:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      messages:
        items:
          $ref: '#/definitions/conversation.MessageResponse'
        type: array
      session_id:
        type: string
      status:
        type: string
    type: object
  conversation.ConversationResponse:
    properties:
      bot_id:
        type: string
      customer_id:
        type: string
      customer_name:
        description: Data customer, di-flatten supaya klien tidak perlu nested lookup.
        type: string
      customer_phone:
        type: string
      ended_at:
        type: string
      last_message:
        description: Ringkasan pesan terakhir untuk preview di card.
        type: string
      last_message_at:
        type: string
      last_message_sender:
        type: string
      message_count:
        description: |-
          MessageCount = total pesan dalam sesi ini.

          CATATAN: kolom read/unread TIDAK ADA di skema database saat ini
          (models.Message hanya punya created_at). Jadi unread_count belum bisa
          dihitung dan sengaja tidak disertakan daripada mengirim angka palsu.
        type: integer
      session_id:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
  conversation.MessageResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      metadata:
        type: string
      sender_type:
        description: SenderType bernilai "customer" atau "bot" (lihat chat/service.go).
        type: string
      session_id:
        type: string
    type: object
  products.CreateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    required:
    - name
    - price
    type: object
  products.UpdateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    required:
    - name
    - price
    type: object
  res.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
host: localhost:3000
info:
  contact: {}
  description: Backend API for Baper Application
  title: Baper API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return JWT tokens
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
      summary: Login User
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Tukar refresh token yang masih berlaku dengan access token baru.
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
      summary: Refresh Access Token
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user into the system
      parameters:
      - description: Registration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
      summary: Register New User
      tags:
      - Auth
  /api/bots/{id}/prompt:
    put:
      consumes:
      - application/json
      description: Update Agent Prompt/API bot milik bisnis sendiri.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      - description: Bot Configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bot.UpdateBotPromptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Update Bot Prompt & API
      tags:
      - Bot
  /api/bots/{id}/toggle:
    patch:
      consumes:
      - application/json
      description: Enable/disable bot milik bisnis sendiri. Bot milik orang lain dijawab
        404.
      parameters:
      - description: Bot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Toggle Bot Active Status
      tags:
      - Bot
  /api/business/recap/monthly:
    get:
      consumes:
      - application/json
      description: Get monthly recap of total revenue and orders
      parameters:
      - description: Year (e.g. 2026)
        in: query
        name: year
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Get Monthly Recap
      tags:
      - Business
  /api/business/recap/monthly/export:
    get:
      description: Download monthly recap in CSV format
      parameters:
      - description: Year (e.g. 2026)
        in: query
        name: year
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Export Monthly Recap to CSV
      tags:
      - Business
  /api/business/register:
    post:
      consumes:
      - application/json
      description: Register a new business for the authenticated user
      parameters:
      - description: Business Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/busines.RegisterBusinessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Register a Business
      tags:
      - Business
  /api/conversations:
    get:
      consumes:
      - application/json
      description: Daftar semua chat session milik bisnis user yang sedang login,
        beserta nama customer, nomor WhatsApp, dan preview pesan terakhir. Dipakai
        untuk layar daftar chat. Diurutkan dari aktivitas terbaru.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/conversation.ConversationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Daftar percakapan (chat list)
      tags:
      - Conversations
  /api/conversations/{id}/messages:
    get:
      consumes:
      - application/json
      description: Ambil seluruh pesan dari satu chat session beserta identitas customer-nya.
        Endpoint ini yang dipanggil ketika card customer di daftar chat ditekan. Percakapan
        milik bisnis lain dijawab 404.
      parameters:
      - description: Chat Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Jumlah maksimum pesan (default 100, maks 200)
        in: query
        name: limit
        type: integer
      - description: Offset paging (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  $ref: '#/definitions/conversation.ConversationDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Pesan dalam satu percakapan
      tags:
      - Conversations
  /api/products:
    get:
      consumes:
      - application/json
      description: Get products milik bisnis user yang sedang login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Get All Products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product. business_id diambil dari token, bukan dari
        body.
      parameters:
      - description: Product Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Create a Product
      tags:
      - Products
  /api/products/{id}:
    delete:
      consumes:
      - application/json
      description: Hapus produk milik bisnis sendiri.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Delete Product
      tags:
      - Products
    get:
      consumes:
      - application/json
      description: Get detail produk. Produk milik bisnis lain dijawab 404.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Get Product by ID
      tags:
      - Products
    put:
      consumes:
      - application/json
      description: Update produk milik bisnis sendiri.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/products.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/res.Response'
      security:
      - BearerAuth: []
      summary: Update Product
      tags:
      - Products
  /api/webhook/:
    get:
      consumes:
      - application/json
      description: Verify webhook endpoint for Meta WhatsApp API
      parameters:
      - description: Mode
        in: query
        name: hub.mode
        required: true
        type: string
      - description: Challenge
        in: query
        name: hub.challenge
        required: true
        type: string
      - description: Verify Token
        in: query
        name: hub.verify_token
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: challenge
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/res.Response'
      summary: Webhook Verification
      tags:
      - Webhook
  /api/webhook/send-media:
    post:
      consumes:
      - application/json
      description: Send a media message (image/document/video/audio) using a public
        URL
      parameters:
      - description: Media Message Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.SendMediaMessage'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
      summary: Send Media via URL
      tags:
      - Webhook
  /api/webhook/send-message:
    post:
      consumes:
      - application/json
      description: Send a text message via WhatsApp
      parameters:
      - description: Message Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.SendMessage'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/res.Response'
      summary: Send Text Message
      tags:
      - Webhook
  /api/webhook/upload-media:
    post:
      consumes:
      - multipart/form-data
      description: Upload a local file and send it as a media message
      parameters:
      - description: Destination Phone Number (e.g. 62812...)
        in: formData
        name: to
        required: true
        type: string
      - description: Media Type (image, document, video, audio)
        in: formData
        name: type
        required: true
        type: string
      - description: Optional Caption
        in: formData
        name: caption
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      summary: Send Media via File Upload
      tags:
      - Webhook
  /api/webhook/verify:
    post:
      consumes:
      - application/json
      description: Receive incoming messages from Meta WhatsApp API
      parameters:
      - description: Webhook Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/chat.WebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.Response'
      summary: Receive Webhook
      tags:
      - Webhook
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
